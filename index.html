<style>
:root{color-scheme:dark;--g:#ffd36e;--gl:rgba(13,22,49,.74)}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101b3b;color:#fff;font-family:system-ui,sans-serif;touch-action:none}

.ac{display:flex;gap:10px;pointer-events:auto}.ac button{width:66px;height:66px;border-radius:50%;padding:4px;background:#182b56dd}.ac .b{width:80px;height:80px;background:#69465bdd;border-color:#ffd36e99}

.pr{background:linear-gradient(135deg,#ffb45e,#ff6d76);border:0;font-size:18px;font-weight:700;padding:13px 38px;border-radius:30px;margin-top:8px}.pr:disabled{opacity:.5}
label{font-size:13px;opacity:.85;display:block;margin-top:6px}input[type=range]{width:70%}#ld{min-height:20px;font-size:13px;color:#ffd36e}

#menu{align-items:flex-end;background:radial-gradient(120% 80% at 50% 110%,#1b2b6bf0 0%,#0a123a99 45%,#0000 75%),linear-gradient(0deg,#050a22ee,#0000 70%)}
.bx{padding-bottom:max(env(safe-area-inset-bottom),26px)}.lg{letter-spacing:.5em;font-size:12px;color:#ffd36e;text-shadow:0 0 12px #ffd36e;margin-bottom:6px}

.pr::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,#0000,#ffffff77,#0000);transform:skewX(-20deg);animation:sh 3s infinite}@keyframes sh{to{left:130%}}.pr:active{transform:scale(.95)}.pr:disabled{opacity:.45}
.set{margin-top:8px;font-size:13px;opacity:.9}.set summary{cursor:pointer;padding:6px;list-style:none;opacity:.8}
.ac button{width:66px;height:66px;font-size:25px;line-height:1;border-radius:50%;padding:0;backdrop-filter:blur(8px);background:radial-gradient(circle at 30% 25%,#bfe6ff66,#4b6cff22 62%,#fff1);border:1.5px solid #bfe3ffaa;box-shadow:0 0 18px #6fb4ff66,inset 0 0 14px #ffffff2a;transition:transform .12s,box-shadow .12s}.ac button:active{transform:scale(.88);box-shadow:0 0 34px #9fe8ffdd}
